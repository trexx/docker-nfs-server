name: 'Build'

on:
  push:
    branches: [ '**' ]
  schedule:
    # Weekly rebuild to pick up Alpine package fixes that don't change the base image
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: 'build-${{ github.ref }}'

jobs:
  build:
    uses: './.github/workflows/build-test-publish.yml'
    secrets: 'inherit'
    permissions:
      contents: 'read'
      packages: 'write'
    with:
      test_command: 'sudo ./test/e2e.sh "${TEST_IMAGE}"'
